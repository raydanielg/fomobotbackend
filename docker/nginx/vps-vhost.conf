# VPS host nginx vhosts — place in /etc/nginx/sites-available/fomobot
# (or conf.d) on the HOST machine, NOT inside any container.
#
# Replace <VPS_IP> with your public IP. sslip.io resolves:
#   api.<VPS_IP>.sslip.io  → backend  (containers bound to 127.0.0.1:8010)
#   app.<VPS_IP>.sslip.io  → frontend (container bound to 127.0.0.1:3100)
#
# These vhosts only own the fomobot hostnames — other projects on this VPS
# keep their own server blocks untouched.

server {
    listen 80;
    server_name api.<VPS_IP>.sslip.io;
    client_max_body_size 25m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.<VPS_IP>.sslip.io;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
