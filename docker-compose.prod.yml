# FomoBot — production compose file.
# Isolated compose project (`-p fomobot`) so it coexists with other projects
# on the same VPS. Only the internal nginx publishes one host port (8010 by
# default) — point your existing reverse proxy / nginx vhost at it.
#
#   docker compose -p fomobot -f docker-compose.prod.yml up -d --build
#
name: fomobot

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://fomobot:${POSTGRES_PASSWORD:-fomobot}@postgres:5432/fomobot
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    DJANGO_SETTINGS_MODULE: config.settings.production
    # Internal service URLs — always resolve to compose services, not localhost.
    WHATSAPP_SERVICE_URL: http://gateway:4000

services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS: production.txt
    <<: *app-env
    command: ./docker/entrypoint.web.sh
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      args:
        REQUIREMENTS: production.txt
    <<: *app-env
    command: celery -A config worker -l info -Q default,messages,webhooks,whatsapp,notifications,automations,celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      args:
        REQUIREMENTS: production.txt
    <<: *app-env
    command: celery -A config beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Real WhatsApp gateway (Baileys multi-device bridge).
  # Owns the WhatsApp sockets; talks to Django over HTTP + the ingress webhook.
  gateway:
    build:
      context: ./gateway
    image: fomobot-gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:-}
      CALLBACK_URL: http://web:8000
      AUTH_DIR: /data/sessions
    volumes:
      - gateway_auth:/data/sessions
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fomobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fomobot}
      POSTGRES_DB: fomobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomobot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
    ports:
      - "${NGINX_PORT:-8010}:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  mediafiles:
  gateway_auth:
