services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS: development.txt
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    env_file: .env
    environment:
      DATABASE_URL: postgres://fomobot:fomobot@postgres:5432/fomobot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QR_SIMULATION: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        REQUIREMENTS: development.txt
    command: celery -A config worker -l info -Q default,messages,webhooks,whatsapp,notifications,automations,celery
    volumes:
      - .:/app
    env_file: .env
    environment:
      DATABASE_URL: postgres://fomobot:fomobot@postgres:5432/fomobot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: .
      args:
        REQUIREMENTS: development.txt
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file: .env
    environment:
      DATABASE_URL: postgres://fomobot:fomobot@postgres:5432/fomobot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fomobot
      POSTGRES_PASSWORD: fomobot
      POSTGRES_DB: fomobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomobot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uncomment to terminate TLS / serve static in front of uvicorn.
  # nginx:
  #   image: nginx:alpine
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #     - staticfiles:/app/staticfiles:ro
  #   ports:
  #     - "80:80"
  #   depends_on: [web]

volumes:
  postgres_data:
  staticfiles:
